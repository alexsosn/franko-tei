name: "Real image-first I/20 + III/130 + IV/100 TEI-to-TF smoke (unverified)"
on:
  pull_request:
    paths:
      - pilot/image_first/**
      - tests/test_image_first_structured.py
      - .github/workflows/image-first-real-tei-tf.yml
      - src/franko_tei/pilot_tf_batch.py
      - src/franko_tei/pilot_tei.py
      - src/franko_tei/pilot_tf.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XML validation and pinned Text-Fabric
        run: python -m pip install -e '.[tf]' lxml
      - name: Run red-first page-replay and real Unicode graph tests
        run: python -m unittest discover -s tests -p test_image_first_structured.py -v
      - name: Fetch three exact native image files and original manifests
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/alexsosn/franko-tei/e871f32537e81f81896f6ce9a6658aba667db9c5/images
          for spec in 1:20 3:130 4:100; do
            vol="${spec%:*}"
            page="${spec#*:}"
            printf -v image 'page-%05d.jpg' "$page"
            mkdir -p "native-assets/vol$vol"
            curl --fail --location --retry 2 --silent --show-error "$base/vol$vol/manifest.json" -o "native-assets/vol$vol/manifest.json"
            curl --fail --location --retry 2 --silent --show-error "$base/vol$vol/$image" -o "native-assets/vol$vol/$image"
          done
      - name: Generate deterministic, source-image-checked unverified TEI
        run: |
          set -euo pipefail
          mkdir -p build
          franko-pilot-tei --images native-assets --input pilot/image_first/vol1_scan00020_single_reading.json --output build/v1-s00020.xml
          franko-pilot-tei --images native-assets --input pilot/image_first/vol3_scan00130_single_reading.json --output build/v3-s00130.xml
          franko-pilot-tei --images native-assets --input pilot/vol4_scan00100_single_reading.json --output build/v4-s00100.xml
          cmp pilot/vol4_scan00100_single_reading.xml build/v4-s00100.xml
      - name: Validate all three XML documents against TEI P5 4.12.0 RNG
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --silent --show-error 'https://www.tei-c.org/Vault/P5/4.12.0/xml/tei/custom/schema/relaxng/tei_all.rng' -o build/tei-all.rng
          python - <<'PY'
          from lxml import etree
          from pathlib import Path
          schema=etree.RelaxNG(etree.parse("build/tei-all.rng"))
          for path in sorted(Path("build").glob("v*-s*.xml")):
              source=etree.parse(str(path))
              assert schema.validate(source), (str(path), str(schema.error_log))
              print(path, "TEI RNG PASS (source text STILL unverified)")
          PY
      - name: Require immutable pinned manifests and actual bytes for all three pages
        run: |
          franko-pilot-tf-batch --images native-assets             --evidence pilot/image_first/vol1_scan00020_single_reading.json --tei build/v1-s00020.xml             --evidence pilot/image_first/vol3_scan00130_single_reading.json --tei build/v3-s00130.xml             --evidence pilot/vol4_scan00100_single_reading.json --tei build/v4-s00100.xml             --output build/three-real-unverified-tf
      - name: Load TF and independently compare code points to persisted first-reading JSONs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tf.fabric import Fabric
          files=[
            "pilot/image_first/vol1_scan00020_single_reading.json",
            "pilot/image_first/vol3_scan00130_single_reading.json",
            "pilot/vol4_scan00100_single_reading.json",
          ]
          drafts=[json.loads(Path(x).read_text("utf8")) for x in files]
          api=Fabric(locations="build/three-real-unverified-tf",silent="deep").load(
            "glyph codepoint teiId pageKey volume scanPage imageSha pdfShaClaim status")
          assert api, "Text-Fabric did not load"
          pages=list(api.F.otype.s("page"))
          assert len(pages)==3, pages
          by_key={api.F.pageKey.v(n):n for n in pages}
          assert set(by_key)=={"v1-s00020","v3-s00130","v4-s00100"}
          for draft in drafts:
              key=f"v{draft['volume']}-s{draft['scan_page']:05d}"
              n=by_key[key]
              assert api.F.imageSha.v(n)==draft["source_image_sha256"]
              assert api.F.pdfShaClaim.v(n)==draft["source_pdf_sha256_claimed_by_manifest"]
              assert api.F.scanPage.v(n)==draft["scan_page"]
              assert api.F.status.v(n)=="agent_unverified"
              pslots=set(api.L.d(n,otype="char"))
              lines=[l for l in api.F.otype.s("line")
                     if set(api.L.d(l,otype="char")).issubset(pslots)]
              lines.sort(key=lambda l:min(api.L.d(l,otype="char")))
              actual=["".join(api.F.glyph.v(s) for s in api.L.d(l,otype="char")) for l in lines]
              expected=[x["text"] for r in draft["reading"]["regions"] for x in r["lines"]]
              assert actual==expected, key
              assert "\n".join(actual)==draft["reading"]["raw_response"], key
              for l in lines:
                  for s in api.L.d(l,otype="char"):
                      assert ord(api.F.glyph.v(s))==api.F.codepoint.v(s)
              print(key, len(lines), "exact Unicode first-reading lines; still agent_unverified")
          PY
      - name: Upload experimental generated TEI and TF only, never native scans
        uses: actions/upload-artifact@v4
        with:
          name: franko-three-real-first-readings-tei-tf-unverified
          path: |
            build/v*-s*.xml
            build/three-real-unverified-tf/*.tf
          retention-days: 7
          if-no-files-found: error
