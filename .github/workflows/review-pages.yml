name: OCR review viewer
on:
  pull_request:
    paths:
      - 'web/**'
      - 'docs/monomakh-icl.html'
      - 'docs/render_monomakh_hybrid.py'
      - 'docs/render_approved_icl.py'
      - 'docs/check_approved_icl_sheets.py'
      - 'docs/monomakh-icl-approved-atlas.json'
      - 'docs/hitl/atlas-extension-*.json'
      - 'src/franko_tei/hitl_atlas.py'
      - 'pilot/**'
      - 'reviews/**'
      - 'src/franko_tei/review_adjudication.py'
      - 'src/franko_tei/native_collation.py'
      - 'src/franko_tei/review_bundle.py'
      - 'src/franko_tei/search_annotations.py'
      - '.github/workflows/review-pages.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/monomakh-icl.html'
      - 'docs/render_monomakh_hybrid.py'
      - 'docs/render_approved_icl.py'
      - 'docs/check_approved_icl_sheets.py'
      - 'docs/monomakh-icl-approved-atlas.json'
      - 'docs/hitl/atlas-extension-*.json'
      - 'src/franko_tei/hitl_atlas.py'
      - 'pilot/**'
      - 'reviews/**'
      - 'src/franko_tei/review_adjudication.py'
      - 'src/franko_tei/native_collation.py'
      - 'src/franko_tei/review_bundle.py'
      - 'src/franko_tei/search_annotations.py'
      - '.github/workflows/review-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install -e . playwright fonttools brotli Pillow
      - run: python web/build_search.py --output web/search
      - run: python -m playwright install --with-deps chromium
      - run: python web/test_editorial_projection.py
      - run: python web/test_fonts.py
      - name: Smoke-render hybrid ICL reference from pinned original scans
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # Avoid downloading reference pages for unrelated transcription PRs.
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE" HEAD -- docs/render_monomakh_hybrid.py docs/render_approved_icl.py docs/check_approved_icl_sheets.py docs/monomakh-icl-approved-atlas.json 'docs/hitl/atlas-extension-*.json' src/franko_tei/hitl_atlas.py docs/monomakh-icl.html web/test_fonts.py web/fonts/Monomakh-Regular.woff2 .github/workflows/review-pages.yml; then
            echo "Hybrid reference unchanged."
            exit 0
          fi
          assets="$(mktemp -d)"
          trap 'rm -rf "$assets"' EXIT
          mkdir -p "$assets/vol1" "$assets/vol2" "$assets/vol3" "$assets/vol4" "$assets/vol5"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/9153892831a157bd6ada7f4f014ba40b21e0d4d4" --jq .content | base64 --decode > "$assets/vol2/page-00100.jpg"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/c53440756c4e58711d5be2d625de357894f2ab72" --jq .content | base64 --decode > "$assets/vol3/page-00130.jpg"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/9883e2359ef030fcf5062b6948dcf624756102a7" --jq .content | base64 --decode > "$assets/vol5/page-00130.jpg"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/5c713459b057b91d78de159a2ccfd105fe22e1c1" --jq .content | base64 --decode > "$assets/vol4/page-00170.jpg"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/9964722946b4cdf79d1d78572a8bb0f27a47e978" --jq .content | base64 --decode > "$assets/vol1/page-00127.jpg"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/5d625c272dfea581d7025ac93089229545822fff" --jq .content | base64 --decode > "$assets/vol3/page-00131.jpg"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/dc12f2bf8279d732e1d3c225b3d9e8bb797b4e04" --jq .content | base64 --decode > "$assets/vol1/page-00128.jpg"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/9c6ad072d4559e8c7a78be369632c505eb22d157" --jq .content | base64 --decode > "$assets/vol1/page-00097.jpg"
          python docs/render_monomakh_hybrid.py --assets "$assets" --output "$assets/reference.png"
          test -s "$assets/reference.png"
          # Active atlas: only approved rows and accepted issue focal evidence.
          # The 42 original review-preview rows are optional local inputs.
          while IFS=$'\t' read -r path blob; do
            if [[ ! -s "$assets/$path" ]]; then
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode > "$assets/$path"
            fi
          done < <(jq -r '.sources[] | [.path,.blob] | @tsv' docs/monomakh-icl-approved-atlas.json)
          python docs/render_approved_icl.py --assets "$assets" --output "$assets/approved.html" --sheet-dir "$assets/sheets"
          test -s "$assets/approved.html"
          python docs/check_approved_icl_sheets.py "$assets/sheets"
          # Validate the committed HITL chain before resolving any extra image paths.
          python docs/render_approved_icl.py --hitl --list-sources > "$assets/sources.tsv"
          while IFS=$'\t' read -r path commit; do
            if [[ ! -s "$assets/$path" ]]; then
              gh api "repos/$GITHUB_REPOSITORY/contents/images/$path?ref=$commit" --jq .content | base64 --decode > "$assets/$path"
            fi
          done < "$assets/sources.tsv"
          python docs/render_approved_icl.py --hitl --assets "$assets" --output "$assets/active.html" --sheet-dir "$assets/active-sheets"
          test -s "$assets/active.html"
          python docs/check_approved_icl_sheets.py "$assets/active-sheets" --hitl
          # Local derivatives only; never upload scan crops.
      - run: python web/test_printed_indexes.py
      - name: Browser reader regression
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null && ! git diff --quiet "$BASE" HEAD -- web/index.html web/review-editor.js web/test_review.py; then
            export FRANKO_UX_SCREENSHOTS="$RUNNER_TEMP/reader-ux"
          fi
          python web/test_review.py
      - name: Upload synthetic UX screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: reader-ux
          path: ${{ runner.temp }}/reader-ux
          if-no-files-found: ignore
          retention-days: 7
      - run: python web/test_review_editor.py
      - run: python web/test_live_review.py
  package:
    needs: browser
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install -e .
      - run: |
          mkdir -p _site
          cp web/index.html web/review-editor.js _site/
          cp -R web/fonts _site/fonts
          python web/build_search.py --output _site/search
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          name: github-pages
          path: _site
  deploy:
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Wait for the uploaded artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              | jq -e --arg id "$ARTIFACT_ID" '.artifacts | length == 1 and (.[0].id | tostring) == $id and (.[0].expired | not)' >/dev/null; then
              echo "Artifact $ARTIFACT_ID visible in Actions API."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Expected Pages artifact $ARTIFACT_ID is not visible."
          exit 1
      - name: Deploy viewer
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      - name: Verify the published revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          verify_fonts() {
            local font
            for font in web/fonts/*; do
              curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "${PAGE_URL%/}/fonts/${font##*/}?rev=$GITHUB_SHA" -o "$RUNNER_TEMP/published-font" || return 1
              cmp -s "$font" "$RUNNER_TEMP/published-font" || return 1
            done
          }
          for attempt in {1..18}; do
            if curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "${PAGE_URL%/}/index.html?rev=$GITHUB_SHA" -o "$RUNNER_TEMP/published-index.html" \
              && cmp -s web/index.html "$RUNNER_TEMP/published-index.html" \
              && curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "${PAGE_URL%/}/review-editor.js?rev=$GITHUB_SHA" -o "$RUNNER_TEMP/published-review.js" \
              && cmp -s web/review-editor.js "$RUNNER_TEMP/published-review.js" \
              && curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "${PAGE_URL%/}/search/vol1.json?rev=$GITHUB_SHA" \
              | jq -e --arg sha "$GITHUB_SHA" '.ref == $sha' >/dev/null \
              && curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "${PAGE_URL%/}/search/annotation-vol1.json?rev=$GITHUB_SHA" \
              | jq -e --arg sha "$GITHUB_SHA" '.ref == $sha and .schema_version == "search-annotation-v1" and .offset_unit == "unicode_code_point"' >/dev/null \
              && curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "${PAGE_URL%/}/search/editorial.json?rev=$GITHUB_SHA" \
              | jq -e --arg sha "$GITHUB_SHA" '.ref == $sha and (.pages | type == "array")' >/dev/null \
              && curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "${PAGE_URL%/}/search/coverage.json?rev=$GITHUB_SHA" \
              | jq -e --arg sha "$GITHUB_SHA" '.ref == $sha and (.volumes | length == 5)' >/dev/null \
              && curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "${PAGE_URL%/}/search/printed-indexes.json?rev=$GITHUB_SHA" \
              | jq -e --arg sha "$GITHUB_SHA" '.ref == $sha and (.sections | length == 4)' >/dev/null \
              && verify_fonts; then
              echo "Public viewer, fonts and search index match $GITHUB_SHA."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public viewer, fonts or search index does not match $GITHUB_SHA."
          exit 1
