name: OCR review viewer
on:
  pull_request:
    paths:
      - 'web/**'
      - 'pilot/**'
      - '.github/workflows/review-pages.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'pilot/**'
      - '.github/workflows/review-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e . playwright
      - run: python web/build_search.py --output web/search
      - run: python -m playwright install --with-deps chromium
      - run: python web/test_review.py
      - run: python web/test_live_review.py
  deploy:
    needs: browser
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e .
      - uses: actions/configure-pages@v6
      - run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          python web/build_search.py --output _site/search
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy viewer
        id: deployment
        uses: actions/deploy-pages@v5
