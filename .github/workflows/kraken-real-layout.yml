name: Kraken physical-line segmentation incl. V/10 two-column facsimile (experimental)
on:
  pull_request:
    paths:
      - src/franko_tei/kraken_layout.py
      - tests/test_kraken_layout.py
      - .github/workflows/kraken-real-layout.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kraken-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kraken 7 segmentation backend
        run: |
          python -m pip install -e .
          python -m pip install 'kraken==7.1.1'
          franko-kraken-layout --help > /dev/null
      - name: Obtain only pinned sample images and checksummed manifests
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/alexsosn/franko-tei/e871f32537e81f81896f6ce9a6658aba667db9c5/images
          for spec in 2:100 3:130 5:10 5:100; do
            vol="${spec%:*}"
            page="${spec#*:}"
            dir="scan-assets/vol$vol"
            mkdir -p "$dir"
            printf -v img 'page-%05d.jpg' "$page"
            curl --fail --location --retry 2 --silent --show-error "$BASE/vol$vol/manifest.json" -o "$dir/manifest.json"
            curl --fail --location --retry 2 --silent --show-error "$BASE/vol$vol/$img" -o "$dir/$img"
          done
      - name: Run unverified image-only segmentation
        run: |
          franko-kraken-layout --images scan-assets --volume 2 --pages 100 --output geometry/vol2
          franko-kraken-layout --images scan-assets --volume 3 --pages 130 --output geometry/vol3
          franko-kraken-layout --images scan-assets --volume 5 --pages 10,100 --output geometry/vol5
      - name: Verify geometry coverage and bounds, not text accuracy
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files=list(Path('geometry').rglob('*.json'))
          assert len(files)==4, files
          for file in files:
              d=json.loads(file.read_text(encoding='utf8'))
              assert d['status']=='segmentation_unchecked'
              assert d['line_count']==len(d['lines'])
              assert d['line_count']>0, f"No line candidates on {file}"
              assert len(d['source_image_sha256'])==64
              if d['volume']=='5' and d['scan_page']==10:
                  # This page has two columns and a cross-column caption.
                  # Bounding-box x alone is a heuristic; never auto-certify
                  # the reading order or original visible text from it.
                  midpoint=d['image_width']/2
                  left=sum(line['bbox_xywh'][0]+line['bbox_xywh'][2]/2 < midpoint for line in d['lines'])
                  right=d['line_count']-left
                  print(f"V/10 candidates: {left} left-center, {right} right-center (UNVERIFIED column assignment)")
              print(f"Volume {d['volume']} scan {d['scan_page']}: {d['line_count']} Kraken candidate physical lines")
          PY
      - name: Verify pinned V/10 geometry against independently saved review
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          original=Path('geometry/vol5/vol5-page-00010-kraken-layout.json')
          record=json.loads(original.read_text(encoding='utf8'))
          review=json.loads(Path('pilot/geometry/vol5_scan00010_column_layout_review.json').read_text(encoding='utf8'))
          assert review['status']==record['status']=='segmentation_unchecked'
          assert review['source_image_sha256']==record['source_image_sha256']
          assert review['kraken_candidate_count']==len(record['lines'])==85
          assert review['kraken_native_json_sha256']==record['native_kraken_json_sha256']
          assert review['kraken_report_sha256']==hashlib.sha256(original.read_bytes()).hexdigest(), 'Kraken run drifted from pinned candidate evidence'
          all_indices=[]
          for region in review['regions']:
              a,b=region['candidate_line_range']
              all_indices.extend(range(a,b+1))
              lines=record['lines'][a-1:b]
              assert all(line['candidate_line_id'].startswith(review['kraken_candidate_id_prefix']) for line in lines)
              x0=min(line['bbox_xywh'][0] for line in lines)
              y0=min(line['bbox_xywh'][1] for line in lines)
              x1=max(line['bbox_xywh'][0]+line['bbox_xywh'][2] for line in lines)
              y1=max(line['bbox_xywh'][1]+line['bbox_xywh'][3] for line in lines)
              actual=[x0,y0,x1,y1]
              expected=region.get('bbox_extent_observed_xyxy')
              if expected is not None:
                  assert actual==expected, (region['id'],actual,expected)
              if region['id']=='stamp-candidate':
                  assert [x0,y0,x1-x0,y1-y0]==region['bbox_xywh']
              if region['id']=='merged-column-bottom':
                  assert region['manual_split_required']
                  assert all(line['bbox_xywh'][2]>800 for line in lines)
          assert sorted(all_indices)==list(range(1,86)), 'duplicate or omitted Kraken candidate'
          assert not review['text_certified'] and review['original_first_transcription_incomplete']
          print('V/10 original-image Kraken geometry matches pinned review; text remains UNREAD')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: franko-kraken-unverified-layout
          path: geometry/**/*.json
          retention-days: 7
          if-no-files-found: error
