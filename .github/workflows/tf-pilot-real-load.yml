name: "Real pilot TEI to Text-Fabric: Unicode and provenance roundtrip"
on:
  pull_request:
    paths:
      - src/franko_tei/pilot_tf.py
      - src/franko_tei/pilot_tei.py
      - tests/test_pilot_tf.py
      - pilot/vol4_scan00100_single_reading.xml
      - .github/workflows/tf-pilot-real-load.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tf-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Text-Fabric
        run: |
          python -m pip install -e '.[tf]'
      - name: Run strict source-anchored feature tests
        run: |
          python -m unittest discover -s tests -p test_pilot_tf.py -v
      - name: Export real IV/100 pilot TEI to TF
        run: |
          franko-pilot-tf --tei pilot/vol4_scan00100_single_reading.xml --output build/vol4-scan00100-tf
      - name: Load TF API and query exact source text and feature graph
        run: |
          python - <<'PY'
          from pathlib import Path
          from tf.fabric import Fabric
          from franko_tei.pilot_tei import extract_transcribed_lines
          path=Path('build/vol4-scan00100-tf')
          api=Fabric(locations=str(path),silent='deep').load(
              'glyph codepoint teiId lineId regionId regionKind lang script '
              'languageUncertain imageSha pdfShaClaim scanPage observedPrintedPage '
              'status noteText')
          assert api, 'Text-Fabric API refused the generated corpus'
          lines=tuple(api.F.otype.s('line'))
          expected=extract_transcribed_lines(Path('pilot/vol4_scan00100_single_reading.xml').read_text(encoding='utf8'))
          seen=[''.join(chr(api.F.codepoint.v(s)) for s in api.L.d(n,otype='char')) for n in lines]
          assert seen==expected, (seen,expected)
          assert len(lines)==13
          assert tuple(api.F.otype.s('page')) and len(api.F.otype.s('page'))==1
          page=tuple(api.F.otype.s('page'))[0]
          assert api.F.scanPage.v(page)==100
          assert api.F.observedPrintedPage.v(page)=='48'
          assert api.F.status.v(page)=='agent_unverified'
          assert api.F.imageSha.v(page)=='f70aff53495efa92c330518017e35efcd0b9ace664fe16eb2436ca01cdcbb2be'
          assert sum(api.F.otype.v(n)=='languageSpan' for n in api.F.otype.s('languageSpan'))>0
          assert any(api.F.lang.v(n)=='ru' for n in api.F.otype.s('languageSpan'))
          assert len(api.F.otype.s('uncertainty'))==3
          assert 'ѣ' in ''.join(seen) and 'ї' in ''.join(seen)
          print('PASS: actual Text-Fabric API loaded 13 lines, 1 page; exact Unicode/source roundtrip and queries')
          PY
      - name: Store experimental TF features only, not images
        uses: actions/upload-artifact@v4
        with:
          name: franko-IV100-agent-unverified-tf-pilot
          path: build/vol4-scan00100-tf/*.tf
          retention-days: 7
          if-no-files-found: error
