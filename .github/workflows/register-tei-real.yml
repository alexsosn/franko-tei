name: Real comparative register TEI
on:
  pull_request:
    paths:
      - src/franko_tei/register_tei.py
      - src/franko_tei/pilot_tei.py
      - tests/test_register_tei.py
      - tests/live_register_tei.py
      - tests/fixtures/comparative_register_oracles.json
      - pilot/structure/vol3_*_register_*.json
      - pilot/vol3_scan00034_single_reading.json
      - pilot/vol3_scan0007?_single_reading.json
      - .github/workflows/register-tei-real.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-schema-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python -m pip install -e '.[pdf,page-assets]' 'lxml>=5,<7'
      - run: python -m unittest discover -s tests -p test_register_tei.py -v
      - run: python tests/live_register_tei.py
