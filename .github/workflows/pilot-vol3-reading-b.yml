name: "Full independent III/130 B image reading: real-source TEI"
on:
  pull_request:
    paths:
      - pilot/vol3_scan00130_independent_image_reading_b.json
      - tests/test_vol3_independent_reading_b.py
      - .github/workflows/pilot-vol3-reading-b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-image-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . lxml
      - name: Download only pinned native image plus manifest
        run: |
          set -euo pipefail
          mkdir -p native-assets/vol3
          SRC=https://raw.githubusercontent.com/alexsosn/franko-tei/e871f32537e81f81896f6ce9a6658aba667db9c5/images/vol3
          curl --fail --silent --show-error --location --retry 2 "$SRC/manifest.json" -o native-assets/vol3/manifest.json
          curl --fail --silent --show-error --location --retry 2 "$SRC/page-00130.jpg" -o native-assets/vol3/page-00130.jpg
      - name: Full-body plus all apparatus P5 TEI source-gated serialization
        run: |
          set -euo pipefail
          franko-pilot-tei --images native-assets --input pilot/vol3_scan00130_independent_image_reading_b.json --output build/iii130-b.xml
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree
          j=json.loads(Path('pilot/vol3_scan00130_independent_image_reading_b.json').read_text())
          lines=[l['text'] for r in j['reading']['regions'] for l in r['lines']]
          assert len(lines)==44
          assert j['reading']['raw_response']==chr(10).join(lines)
          root=etree.parse('build/iii130-b.xml')
          ns={'t':'http://www.tei-c.org/ns/1.0'}
          assert len(root.xpath('//t:lb',namespaces=ns))==44
          assert len(root.xpath('//t:pb',namespaces=ns))==1
          assert len(root.xpath('//t:seg[@xml:lang="grc"]',namespaces={**ns,'xml':'http://www.w3.org/XML/1998/namespace'}))>0
          print('44 source-linked physical lines including complete apparatus; glyphs unverified.')
          PY
      - name: Negative source checksum and omitted-line mutations must be rejected
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory
          src=json.loads(Path('pilot/vol3_scan00130_independent_image_reading_b.json').read_text())
          with TemporaryDirectory() as td:
              for case in ('bad_image_sha','deleted_apparatus_line'):
                  j=json.loads(json.dumps(src))
                  if case=='bad_image_sha':
                      j['source_image_sha256']='0'*64
                  else:
                      j['reading']['regions'][2]['lines'].pop()
                  inp=Path(td)/f'{case}.json'
                  out=Path(td)/f'{case}.xml'
                  inp.write_text(json.dumps(j,ensure_ascii=False),encoding='utf-8')
                  r=subprocess.run(['franko-pilot-tei','--images','native-assets','--input',str(inp),'--output',str(out)],capture_output=True,text=True)
                  assert r.returncode!=0,case
                  assert not out.exists(),case
                  print(f'{case}: rejected')
          PY
      - name: Validate TEI P5 4.12.0 Relax NG
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            'https://www.tei-c.org/Vault/P5/4.12.0/xml/tei/custom/schema/relaxng/tei_all.rng' -o build/tei_all_4.12.0.rng
          python - <<'PY'
          from lxml import etree
          schema=etree.RelaxNG(etree.parse('build/tei_all_4.12.0.rng'))
          doc=etree.parse('build/iii130-b.xml')
          assert schema.validate(doc),schema.error_log
          print('TEI P5 schema valid; no scholarly verification or release.')
          PY
      - name: Upload generated text-only TEI, never images
        uses: actions/upload-artifact@v4
        with:
          name: franko-iii130-b-unverified-full-page-tei
          path: build/iii130-b.xml
          retention-days: 7
          if-no-files-found: error
