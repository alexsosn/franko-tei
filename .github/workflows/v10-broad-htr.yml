name: "V/10: experimental OCR candidates across 76 original-source bands"
on:
  pull_request:
    paths:
      - .github/workflows/v10-broad-htr.yml
      - tests/test_v10_broad_htr.py
      - src/franko_tei/v10_bands.py
      - src/franko_tei/crnn_probe.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vetted source-image and CPU specialist recognition dependencies
        run: |
          python -m pip install -e '.[page-assets]'
          python -m pip install 'kraken==7.1.1' huggingface_hub torchvision
      - name: Verify unchanged native V/10 JPEG and source manifest
        run: |
          set -euo pipefail
          mkdir -p real-images/vol5
          URL=https://raw.githubusercontent.com/alexsosn/franko-tei/e871f32537e81f81896f6ce9a6658aba667db9c5/images/vol5
          curl --fail --silent --show-error --location --retry 2 "$URL/manifest.json" -o real-images/vol5/manifest.json
          curl --fail --silent --show-error --location --retry 2 "$URL/page-00010.jpg" -o real-images/vol5/page-00010.jpg
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('real-images/vol5/page-00010.jpg')
          m=json.loads(Path('real-images/vol5/manifest.json').read_text())
          expected='3b2ada467b3cca0ebbc551ef478e900eaad9dec093b33ee5a8abc05d2bd8757c'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==expected
          assert next(a['sha256'] for a in m['pages'][9]['artifacts'] if a['role']=='page_image')==expected
          assert (m['pages'][9]['width'],m['pages'][9]['height'])==(1190,1701)
          print('Pinned V/10 native pixel identity confirmed; no accepted glyphs.')
          PY
      - name: Derive the broad unverified 76-band line plan, preserving exclusions
        run: |
          franko-kraken-layout --images real-images --volume 5 --pages 10 --output geometry/vol5
          franko-v10-bands --scope broad --images real-images --layout geometry/vol5/vol5-page-00010-kraken-layout.json --output geometry/v10-broad-source-bands.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('geometry/v10-broad-source-bands.json').read_text())
          assert p['line_count']==76 and p['original_candidate_count']==85
          assert len(p['excluded_source_candidate_ids'])==9
          assert p['short_band_count']==0
          assert p['high_ink_seam_count']==21
          assert p['coverage_is_complete'] is False
          assert p['status']=='segmentation_unchecked'
          assert p['source_image_sha256']=='3b2ada467b3cca0ebbc551ef478e900eaad9dec093b33ee5a8abc05d2bd8757c'
          for column in (p['lines'][:36],p['lines'][36:]):
              for x,y in zip(column,column[1:]):
                  assert x['bbox_xywh'][1]+x['bbox_xywh'][3]==y['bbox_xywh'][1]
          print('The 76 provisional pixel bands remain image-unverified, including 21 risky seams.')
          PY
      - name: Obtain pinned, reviewed Polyscriptor inference code and model revisions
        run: |
          set -euo pipefail
          mkdir -p upstream
          SRC=https://raw.githubusercontent.com/achimrabus/polyscriptor/7994ccadc537c59b0b90eb25b66dfa5d54976d6d
          curl --fail --location --retry 2 --silent --show-error "$SRC/inference_pylaia_native.py" -o upstream/inference_pylaia_native.py
          curl --fail --location --retry 2 --silent --show-error "$SRC/htr_engine_base.py" -o upstream/htr_engine_base.py
          python - <<'PY'
          import json
          from pathlib import Path
          from huggingface_hub import snapshot_download
          repos={
            'church-slavonic':('achimrabus/crnn-ctc-church-slavonic','2b253a83840eba1948e750b246d60991d3a15285'),
            'prosta-mova':('achimrabus/crnn-ctc-prosta-mova','db88dcb5dfb767ef27066b012271cf4e6eb31a40'),
          }
          specs={}
          for name,(repo,revision) in repos.items():
              dst=Path('models')/name
              snapshot_download(repo_id=repo,revision=revision,allow_patterns=['best_model.pt','symbols.txt'],local_dir=str(dst))
              assert (dst/'best_model.pt').is_file() and (dst/'symbols.txt').is_file()
              specs[name]={'repo':repo,'revision':revision,'checkpoint':str(dst/'best_model.pt'),'symbols':str(dst/'symbols.txt')}
          Path('models/specs.json').write_text(json.dumps(specs,indent=2),encoding='utf8')
          PY
      - name: Run all 76 source-derived bands in bounded 10-line batches, models paired
        run: |
          python - <<'PY'
          import subprocess
          for start in range(1, 77, 10):
              count=min(10,77-start)
              cmd=[
                  'franko-crnn-probe','--images','real-images','--volume','5',
                  '--layout','geometry/v10-broad-source-bands.json',
                  '--model-specs','models/specs.json',
                  '--inference-script','upstream/inference_pylaia_native.py',
                  '--start-line',str(start),'--max-lines',str(count),
                  '--margin-x','0','--margin-y','0',
                  '--output',f'ocr-results/v10-broad-batch-{start:02d}.json',
              ]
              print('Running pinned source OCR candidates',start,'to',start+count-1,flush=True)
              subprocess.run(cmd,check=True)
          PY
      - name: Audit source/weights/crops and retain all uncorrected candidate strings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          layout=json.loads(Path('geometry/v10-broad-source-bands.json').read_text())
          rows=[]
          for p in sorted(Path('ocr-results').glob('v10-broad-batch-*.json')):
              rows+=json.loads(p.read_text(encoding='utf8'))
          assert len(rows)==152
          grouped={}
          for row in rows:
              assert row['status']=='ocr_unchecked'
              assert row['source_image_sha256']=='3b2ada467b3cca0ebbc551ef478e900eaad9dec093b33ee5a8abc05d2bd8757c'
              assert row['margin_px']==[0,0]
              assert len(row['crop_png_sha256'])==64
              assert len(row['model_checkpoint_sha256'])==64
              grouped.setdefault(row['candidate_line_id'],[]).append(row)
          assert len(grouped)==76
          for ident,pair in grouped.items():
              assert len(pair)==2
              assert {r['model_name'] for r in pair}=={'church-slavonic','prosta-mova'}
              assert len({r['crop_png_sha256'] for r in pair})==1
              assert len({tuple(r['bbox_crop_xyxy']) for r in pair})==1
          risks={x['candidate_line_id']:x['seam_may_cut_ink'] for x in layout['lines']}
          for row in rows:
              row['source_seam_may_cut_ink']=risks[row['candidate_line_id']]
              row['caution']+=' Raw candidate only; no accepted glyphs, not suitable for direct TEI/TF.'
          out={'status':'ocr_unchecked','volume':'5','scan_page':10,
               'source_image_sha256':layout['source_image_sha256'],
               'source_layout_sha256':layout['source_layout_sha256'],
               'original_candidate_count':85,'covered_candidate_count':76,
               'excluded_candidate_ids':layout['excluded_source_candidate_ids'],
               'high_ink_seam_count':21,'text_verified':False,'cer_measured':False,
               'reference_text_used':False,
               'warning':'21 ink-crossing seams, possible lost titla/ligatures; no accepted glyphs.',
               'candidates':rows}
          Path('ocr-results/v10-broad-paired.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print('152 unchecked predictions across 76 provisional bands, 21 risky seams; no accepted glyphs.')
          # Log each raw candidate as independently parsable evidence, so
          # a trusted GitHub tool can persist all 152 records after the run.
          # None of these strings are proofread or accepted as diplomatic text.
          for row in rows:
              compact={k:row[k] for k in (
                  'status','candidate_line_id','model_name','model_repo','model_revision',
                  'model_checkpoint_sha256','model_symbols_sha256','crop_png_sha256',
                  'bbox_crop_xyxy','source_image_sha256','source_seam_may_cut_ink',
                  'transcription','model_internal_confidence')}
              print('FRANKO_BROAD_RECORD_JSON '+json.dumps(compact,ensure_ascii=False,separators=(',',':')))
          for row in rows[:8]:
              print('Example',row['candidate_line_id'],row['model_name'],row['transcription'][:90])
          PY
      - name: Retain reproducible TEXT-ONLY OCR candidates and geometry for up to 90 days
        uses: actions/upload-artifact@v4
        with:
          name: franko-v10-broad-76-rows-two-models-ocr-unchecked
          path: |
            ocr-results/*.json
            geometry/v10-broad-source-bands.json
          retention-days: 90
          if-no-files-found: error
