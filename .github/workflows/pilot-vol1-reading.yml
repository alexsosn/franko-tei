name: "Full image-first I/20 reading: source-checked TEI"
on:
  pull_request:
    paths:
      - pilot/vol1_scan00020_single_reading.json
      - tests/test_vol1_image_reading.py
      - .github/workflows/pilot-vol1-reading.yml
      - src/franko_tei/pilot_tei.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-first-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . lxml
      - name: Fetch only immutable I/20 JPEG plus its original manifest
        run: |
          set -euo pipefail
          mkdir -p native-assets/vol1
          SRC=https://raw.githubusercontent.com/alexsosn/franko-tei/e871f32537e81f81896f6ce9a6658aba667db9c5/images/vol1
          curl --fail --silent --show-error --location --retry 2 "$SRC/manifest.json" -o native-assets/vol1/manifest.json
          curl --fail --silent --show-error --location --retry 2 "$SRC/page-00020.jpg" -o native-assets/vol1/page-00020.jpg
      - name: Source-gated pilot TEI including all mixed-script physical lines
        run: |
          set -euo pipefail
          franko-pilot-tei --images native-assets --input pilot/vol1_scan00020_single_reading.json --output build/i20.xml
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree
          source=json.loads(Path('pilot/vol1_scan00020_single_reading.json').read_text(encoding='utf-8'))
          lines=[line['text'] for region in source['reading']['regions'] for line in region['lines']]
          assert len(lines) == 42
          assert source['reading']['raw_response'] == chr(10).join(lines)
          root=etree.parse('build/i20.xml')
          ns={'t':'http://www.tei-c.org/ns/1.0'}
          assert len(root.xpath('//t:lb', namespaces=ns)) == 42
          assert len(root.xpath('//t:pb', namespaces=ns)) == 1
          assert len(root.xpath('//t:seg[@xml:lang="grc"]',namespaces=ns)) > 0
          print('Source hash/line count/Greek spans: pass; glyphs remain agent_unverified.')
          PY
      - name: Mutation negative controls must fail closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory
          orig=json.loads(Path('pilot/vol1_scan00020_single_reading.json').read_text(encoding='utf-8'))
          with TemporaryDirectory() as d:
              p=Path(d)
              for kind in ('forged_image_hash','deleted_physical_line'):
                  doc=json.loads(json.dumps(orig))
                  if kind == 'forged_image_hash':
                      doc['source_image_sha256']='0' * 64
                  else:
                      doc['reading']['regions'][1]['lines'].pop(0)
                  candidate=p / (kind + '.json')
                  output=p / (kind + '.xml')
                  candidate.write_text(json.dumps(doc,ensure_ascii=False),encoding='utf-8')
                  result=subprocess.run(['franko-pilot-tei','--images','native-assets','--input',str(candidate),'--output',str(output)],capture_output=True,text=True)
                  assert result.returncode != 0, f'{kind} incorrectly accepted'
                  assert not output.exists(), f'{kind} left invalid output'
                  print(f'{kind}: correctly refused')
          PY
      - name: TEI P5 4.12.0 Relax NG
        run: |
          curl --fail --silent --show-error --location --retry 2 \
            'https://www.tei-c.org/Vault/P5/4.12.0/xml/tei/custom/schema/relaxng/tei_all.rng' -o build/tei_all_4.12.0.rng
          python - <<'PY'
          from lxml import etree
          schema=etree.RelaxNG(etree.parse('build/tei_all_4.12.0.rng'))
          tree=etree.parse('build/i20.xml')
          assert schema.validate(tree), schema.error_log
          print('TEI P5 RNG valid; not an independent transcription review.')
          PY
      - name: Save only text-only unverified TEI (no source scan redistribution)
        uses: actions/upload-artifact@v4
        with:
          name: franko-i20-single-context-unverified-tei
          path: build/i20.xml
          retention-days: 7
          if-no-files-found: error
