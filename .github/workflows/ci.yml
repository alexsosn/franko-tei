name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[pdf,page-assets]'
      - run: python -m unittest discover -s tests -v
      - run: franko-tei catalog > /dev/null
      - name: Enforce fail-closed unreleased corpus
        run: |
          if franko-tei audit-release; then
            echo "Unexpected release-ready status" >&2
            exit 1
          fi
