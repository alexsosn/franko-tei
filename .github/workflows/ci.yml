name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install XML source-build prerequisites on Python 3.15
        if: matrix.python-version == '3.15'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev
      - run: python -m pip install -e '.[pdf,page-assets,tf]' 'lxml>=5,<7'
      - run: python -m pip check
      - run: python -c "import pymupdf, PIL, lxml.etree; from tf.fabric import Fabric"
      - run: python -m unittest discover -s tests -v
      - name: Validate editorial ledger when present or changed
        if: matrix.python-version == '3.15'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TRUSTED: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$TRUSTED" =~ ^[0-9a-f]{40}$ ]]
          # Inspect old paths too, so deleting every record cannot skip validation.
          git fetch --no-tags --depth=1 origin "$BASE"
          if [[ -d reviews/intake || -d reviews/adjudications ]] || [[ -n "$(git ls-tree -r --name-only "$BASE" -- reviews/intake reviews/adjudications)" ]]; then
            if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
              git fetch --no-tags --unshallow origin main
            fi
            python -m franko_tei.review_adjudication --check --trusted-commit "$TRUSTED" --previous-commit "$BASE"
          fi
      - name: Source-gated editorial TEI smoke
        if: matrix.python-version == '3.15'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "$BASE" HEAD -- src/franko_tei/review_tei.py src/franko_tei/review_tf.py src/franko_tei/pilot_tf.py src/franko_tei/pilot_tf_batch.py tests/test_review_tei.py tests/live_review_tei.py src/franko_tei/native_collation.py pilot/reviews/vol4_scan00068_native_collation_20261127.json pilot/reviews/vol1_scan00316_native_collation_20261127.json tests/test_ponavica_collation.py reviews pyproject.toml .github/workflows/ci.yml; then
            python tests/live_review_tei.py
          fi
      - run: franko-tei catalog > /dev/null
      - name: Enforce fail-closed unreleased corpus
        run: |
          if franko-tei audit-release; then
            echo "Unexpected release-ready status" >&2
            exit 1
          fi
